name: fern
description: "A personal-finance dashboard for New Zealand banks, built on the Akahu API."
publish_to: 'none'

version: 1.0.20+21

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  chopper: ^8.0.3
  json_annotation: ^4.9.0
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  drift: 2.34.0
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.6
  path: ^1.9.1
  fl_chart: ^0.69.0
  image_picker: ^1.2.3
  csv: ^8.0.0
  permission_handler: ^12.0.1
  file_picker: ^12.0.0-beta.7
  share_plus: 13.2.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.9.0

  flutter_lints: ^6.0.0
  test: ^1.31.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.24.0
  build_runner: ^2.4.13
  chopper_generator: ^8.0.3
  json_serializable: ^6.8.0
  swagger_dart_code_generator: ^4.1.1
  msix:
    git:
      url: https://github.com/insertjokehere/msix.git
      ref: msvc_redist

patrol:
  app_name: Fern
  test_directory: patrol_test
  android:
    package_name: com.fernmoney.fern_money

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#10382A"
  adaptive_icon_foreground: "assets/icon/icon_foreground_1024.png"
  macos:
    generate: true
    image_path: "assets/icon/icon_master_1024.png"
  windows:
    generate: true
    image_path: "assets/icon/icon_master_1024.png"
    icon_size: 256

msix_config:
  msstore_appId: 9NST4F2TQ00Q
  display_name: Fern - Personal Finance
  publisher_display_name: Brandon Dick
  identity_name: FrisbeeSoftware.Fern-PersonalFinance
  msix_version: 1.0.20.0
  logo_path: assets/icon/icon_master_1024.png
  trim_logo: false
  publisher: CN=BB0811CB-EED5-441C-BE1B-D31F391F76DE
  store: true

flutter:
  uses-material-design: true
