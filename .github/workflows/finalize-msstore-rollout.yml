name: Finalize Microsoft Store rollout

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: fern-msstore-rollout
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1
        with:
          version: v0.4.1

      - name: Configure Microsoft Store CLI
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} --sellerId ${{ secrets.SELLER_ID }}

      - name: Finalize completed rollout
        shell: pwsh
        run: ./scripts/finalize-msstore-rollout.ps1
