name: Sync Google Play listing

on:
  push:
    branches: [main]
    paths:
      - "fastlane/metadata/android/**"
      - "fastlane/Fastfile"
      - "fastlane/Appfile"
      - ".github/workflows/google-play-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: google-play-metadata
  cancel-in-progress: true

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Configure Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/google-play.json"
      - name: Upload metadata
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/google-play.json
        run: bundle exec fastlane android metadata track:production
