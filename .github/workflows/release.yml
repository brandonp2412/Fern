name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fern-release-main
  # A newer main commit supersedes an in-progress release. Keeping an older
  # run alive can make its version-bump push race the newer commit.
  cancel-in-progress: true

jobs:
  test:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: ./scripts/check.sh

  screenshots:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }} screenshots
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          FERN_DEVICE_TYPE: ${{ matrix.device_type }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            ./scripts/ci-screenshots.sh ||
            { adb reconnect offline || true; adb wait-for-device; ./scripts/ci-screenshots.sh; }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol E2E tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/smoke_test.dart

  version-bump:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    needs: [test, screenshots, patrol]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release the newest main commit, not the event SHA that may have
          # become stale while test, screenshot, and Patrol jobs were running.
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Download phone screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots-phoneScreenshots
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download seven-inch screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots-sevenInchScreenshots
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download ten-inch screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: screenshots-tenInchScreenshots
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      - name: Bump version and tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=${CURRENT%+*}
          BUILD_NUMBER=${CURRENT#*+}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEW_VERSION_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
          NEW_VERSION="$NEW_VERSION_NAME+$((BUILD_NUMBER + 1))"
          # Microsoft Store requires the fourth (revision) component to be 0.
          NEW_MSIX_VERSION="$NEW_VERSION_NAME.0"

          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          sed -i "s/^  msix_version: .*/  msix_version: $NEW_MSIX_VERSION/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml fastlane/metadata/android/en-US/images
          git commit -m "Release $NEW_VERSION_NAME [skip ci]"
          git tag "v$NEW_VERSION_NAME"
          gh auth setup-git
          git push origin HEAD:main
          git push origin "v$NEW_VERSION_NAME"

          echo "version=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fern.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fern-apk
          path: build/app/outputs/flutter-apk/fern.apk

  build-msix:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX
        run: flutter pub run msix:create

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fern-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
          retention-days: 7

  publish-windows-store:
    needs: [version-bump, build-msix]
    runs-on: windows-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fern-msix
          path: build/windows/x64/runner/Release

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@3b2ec9136230357ce9abc02b9d056626fb248d3f # v1
        with:
          version: v0.4.1

      - name: Configure Microsoft Store CLI
        shell: pwsh
        env:
          MSSTORE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          MSSTORE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MSSTORE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          MSSTORE_SELLER_ID: ${{ secrets.SELLER_ID }}
        run: msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET --sellerId $env:MSSTORE_SELLER_ID

      - name: Finalize previous completed rollout
        shell: pwsh
        run: ./scripts/finalize-msstore-rollout.ps1

      - name: Publish to Microsoft Store
        run: |
          $package = Get-ChildItem build/windows/x64/runner/Release -Filter *.msix | Select-Object -First 1
          if (-not $package) {
            throw "No MSIX package found"
          }

          # Store uploads occasionally fail while transferring to Azure Blob.
          # The CLI reuses the draft it created, so retrying is safe.
          $attempts = 3
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            msstore publish . `
              --inputDirectory $package.DirectoryName `
              --appId 9NST4F2TQ00Q `
              --packageRolloutPercentage 100 `
              --uploadTimeout 600 `
              --verbose

            if ($LASTEXITCODE -eq 0) {
              exit 0
            }

            if ($attempt -lt $attempts) {
              Write-Warning "Microsoft Store publish attempt $attempt failed; retrying in 30 seconds"
              Start-Sleep -Seconds 30
            }
          }

          throw "Microsoft Store publish failed after $attempts attempts"

      - name: Start Microsoft Store finalization checks
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const workflowId = 'finalize-msstore-rollout.yml';
            await github.rest.actions.enableWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
            });
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowId,
              ref: context.ref.replace('refs/heads/', ''),
            });

  deploy-android:
    needs: [test, version-bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Configure Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/google-play.json"

      - run: flutter pub get
      - run: dart run build_runner build -d

      - name: Deploy to Google Play production
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/google-play.json
        run: bundle exec fastlane android production

  create-release:
    needs: [version-bump, build-apk, build-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fern-apk

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fern-msix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version-bump.outputs.version }}
        run: |
          gh release create "v${RELEASE_VERSION}" \
            fern.apk \
            ./*.msix \
            --repo "$REPOSITORY" \
            --title "v${RELEASE_VERSION}" \
            --generate-notes
