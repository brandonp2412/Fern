name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: |
          curl -sSfL -o swaggers/akahu.swagger https://developers.akahu.nz/openapi/api-akahu-io-spec.yml
      - run: dart run build_runner build -d
      - run: flutter test

  version-bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=${CURRENT%+*}
          BUILD_NUMBER=${CURRENT#*+}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEW_VERSION_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
          NEW_VERSION="$NEW_VERSION_NAME+$((BUILD_NUMBER + 1))"

          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Release $NEW_VERSION_NAME [skip ci]"
          git tag "v$NEW_VERSION_NAME"
          git push origin HEAD:main
          git push origin "v$NEW_VERSION_NAME"

          echo "version=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fern.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fern-apk
          path: build/app/outputs/flutter-apk/fern.apk

  deploy-web:
    needs: version-bump
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: [version-bump, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fern-apk

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version-bump.outputs.version }}" \
            fern.apk \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.version-bump.outputs.version }}" \
            --generate-notes
