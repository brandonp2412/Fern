name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fern-release-main
  # A newer main commit supersedes an in-progress release.  Keeping an older
  # run alive can make its version-bump push race the newer commit.
  cancel-in-progress: true

jobs:
  test:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: ./scripts/check.sh

  screenshots:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device_type: phoneScreenshots
            profile: pixel_6
          - device_type: sevenInchScreenshots
            profile: Nexus 7
          - device_type: tenInchScreenshots
            profile: Nexus 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate ${{ matrix.device_type }} screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FERN_DEVICE_TYPE: ${{ matrix.device_type }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci-screenshots.sh

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device_type }}
          path: fastlane/metadata/android/en-US/images/${{ matrix.device_type }}
          if-no-files-found: error
          retention-days: 7

  patrol:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Install Patrol CLI
        run: |
          dart pub global activate patrol_cli 4.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Patrol E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: patrol test -t patrol_test/smoke_test.dart

  version-bump:
    if: "github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    needs: [test, screenshots, patrol]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit_sha: ${{ steps.bump.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release the newest main commit, not the event SHA that may have
          # become stale while test, screenshot, and Patrol jobs were running.
          ref: main
          fetch-depth: 0

      - name: Bump version and tag
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=${CURRENT%+*}
          BUILD_NUMBER=${CURRENT#*+}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          NEW_VERSION_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
          NEW_VERSION="$NEW_VERSION_NAME+$((BUILD_NUMBER + 1))"
          # Microsoft Store requires the fourth (revision) component to be 0.
          NEW_MSIX_VERSION="$NEW_VERSION_NAME.0"

          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          sed -i "s/^  msix_version: .*/  msix_version: $NEW_MSIX_VERSION/" pubspec.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Release $NEW_VERSION_NAME [skip ci]"
          git tag "v$NEW_VERSION_NAME"
          git push origin HEAD:main
          git push origin "v$NEW_VERSION_NAME"

          echo "version=$NEW_VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-apk:
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build -d
      - run: flutter build apk --release

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/fern.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fern-apk
          path: build/app/outputs/flutter-apk/fern.apk

  build-msix:
    needs: version-bump
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build -d

      - name: Build Windows
        run: flutter build windows --release

      - name: Create MSIX
        run: flutter pub run msix:create

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: fern-msix
          path: build/windows/x64/runner/Release/*.msix
          if-no-files-found: error
          retention-days: 7

  publish-windows-store:
    needs: [version-bump, build-msix]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: fern-msix
          path: build/windows/x64/runner/Release

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Setup Microsoft Store CLI
        uses: microsoft/setup-msstore-cli@v1

      - name: Configure Microsoft Store CLI
        run: msstore reconfigure --tenantId ${{ secrets.AZURE_TENANT_ID }} --clientId ${{ secrets.AZURE_CLIENT_ID }} --clientSecret ${{ secrets.AZURE_CLIENT_SECRET }} --sellerId ${{ secrets.SELLER_ID }}

      - name: Publish to Microsoft Store
        run: |
          $package = Get-ChildItem build/windows/x64/runner/Release -Filter *.msix | Select-Object -First 1
          if (-not $package) {
            throw "No MSIX package found"
          }
          msstore publish . --inputDirectory $package.DirectoryName --appId 9NST4F2TQ00Q --packageRolloutPercentage 100

  deploy-android:
    needs: [test, version-bump]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.commit_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Android release signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } > android/key.properties

      - name: Configure Google Play credentials
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/google-play.json"

      - run: flutter pub get
      - run: dart run build_runner build -d

      - name: Deploy to Google Play production
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ runner.temp }}/google-play.json
        run: bundle exec fastlane android production

  create-release:
    needs: [version-bump, build-apk, build-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fern-apk

      - uses: actions/download-artifact@v4
        with:
          name: fern-msix

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.version-bump.outputs.version }}" \
            fern.apk \
            ./*.msix \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.version-bump.outputs.version }}" \
            --generate-notes
